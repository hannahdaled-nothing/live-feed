<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Camera Feed</title>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
  <style>
    :root {
      --bg: #f4f4f2;
      --panel: #ffffff;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --border: #dcdcd8;
      --accent: #d7263d;
      --abyss: #0b1d3a;
      --glow: #4cc9ff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111112;
        --panel: #1b1b1d;
        --text: #eeeeee;
        --muted: #9a9a9a;
        --border: #2e2e31;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      gap: 16px;
    }
    header, .controls, .stage, .creature-bar { width: 100%; max-width: 960px; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 { font-size: 20px; margin: 0; font-weight: 600; }
    .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
    .live .dot { background: var(--accent); animation: pulse 1.4s infinite; }
    .live { color: var(--text); }
    @keyframes pulse { 50% { opacity: .35; } }
    .stage {
      aspect-ratio: 16 / 9;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }
    /* The video only feeds the canvas; it stays in the DOM so every browser keeps decoding it. */
    video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
    canvas.mirror { transform: scaleX(-1); }
    /* the 3D creatures render on a transparent canvas laid exactly over the feed */
    canvas.overlay { position: absolute; inset: 0; pointer-events: none; }
    .message {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      color: #ccc;
    }
    .banner {
      position: absolute;
      left: 50%;
      top: 12px;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, .65);
      color: #fff;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      pointer-events: none;
      white-space: nowrap;
    }
    .creature-bar {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      min-height: 48px;
    }
    .creature-bar strong { font-size: 17px; }
    .creature-bar span { color: var(--muted); font-size: 14px; }
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .controls button, select {
      font: inherit;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
    }
    select { max-width: 100%; }
    .controls button:hover { border-color: var(--muted); }
    .clock { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>Live Camera Feed</h1>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Starting…</span></div>
  </header>

  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" class="mirror"></canvas>
    <canvas id="gl" class="mirror overlay"></canvas>
    <canvas id="hud" class="mirror overlay"></canvas>
    <div class="message" id="message">Requesting camera access…</div>
    <div class="banner" id="banner" hidden></div>
  </div>

  <div class="creature-bar" aria-live="polite">
    <strong id="creatureName">Deep-sea creatures are swimming around you</strong>
    <span id="creatureFact">Pinch one with your thumb and finger to catch it.</span>
  </div>

  <div class="controls">
    <select id="cameraSelect" aria-label="Camera" hidden></select>
    <button id="toggleBtn">Pause</button>
    <button id="mirrorBtn">Mirror: on</button>
    <button id="snapBtn">Save snapshot</button>
    <span class="clock" id="clock"></span>
  </div>

  <script type="module">
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const glCanvas = document.getElementById('gl');
    const hud = document.getElementById('hud');
    const ctx = canvas.getContext('2d');
    const hctx = hud.getContext('2d');
    const message = document.getElementById('message');
    const banner = document.getElementById('banner');
    const statusEl = document.getElementById('status');
    const statusText = document.getElementById('statusText');
    const cameraSelect = document.getElementById('cameraSelect');
    const toggleBtn = document.getElementById('toggleBtn');
    const mirrorBtn = document.getElementById('mirrorBtn');
    const snapBtn = document.getElementById('snapBtn');
    const creatureName = document.getElementById('creatureName');
    const creatureFact = document.getElementById('creatureFact');

    const MAX_WIDTH = 1280;
    const TAU = Math.PI * 2;
    let stream = null;

    // The 3D creatures from creatures3d.js, in the same order it builds them.
    //   r: collision radius and cy: height of its middle, both as a fraction of its size
    const CREATURES = [
      { name: 'Dumbo octopus', r: 0.4, cy: 0.42, fact: 'Flaps ear-like fins to swim. It lives deeper than any other known octopus.' },
      { name: 'Anglerfish', r: 0.45, cy: 0.45, fact: 'Dangles a glowing lure from its head to tempt prey into its toothy mouth.' },
      { name: 'Blue dragon', r: 0.38, cy: 0.22, fact: 'A tiny sea slug that floats upside down and steals stinging cells from the jellyfish it eats.' },
      { name: 'Barreleye fish', r: 0.5, cy: 0.42, fact: 'Its head is see-through, and its glowing green eyes swivel to look up through it.' },
      { name: 'Atolla jellyfish', r: 0.42, cy: 0.55, fact: 'When attacked it sets off a ring of flashing blue lights, like a burglar alarm.' }
    ];

    let stage3d = null;          // null = loading, false = failed
    async function load3D() {
      try {
        const { createStage } = await import('./creatures3d.js');
        stage3d = createStage(glCanvas);
      } catch (err) {
        console.warn('3D creatures unavailable', err);
        stage3d = false;
      }
    }

    // ======================================================================
    // Hand tracking with MediaPipe Hands (runs locally in the browser).
    // Pinch a creature (thumb tip to index tip) to grab it; open your hand
    // or move it out of view to let go.
    // ======================================================================
    let hands = null;             // null = not loaded yet, false = failed
    let hand = null;              // the tracked hand: { x, y, pinched, wasPinched, seen }
    let everGrabbed = false;
    let lastTime = performance.now();

    async function loadHands() {
      try {
        const v = '0.10.14';
        const { FilesetResolver, HandLandmarker } = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${v}/vision_bundle.mjs`);
        const files = await FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${v}/wasm`);
        hands = await HandLandmarker.createFromOptions(files, {
          baseOptions: {
            modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
            delegate: 'GPU'
          },
          runningMode: 'VIDEO',
          numHands: 2
        });
      } catch (err) {
        console.warn('Hand tracker unavailable', err);
        hands = false;
      }
    }

    function trackHands(nowMs) {
      if (!hands) return;
      const res = hands.detectForVideo(video, nowMs);
      const W = canvas.width, H = canvas.height;
      const P = p => ({ x: p.x * W, y: p.y * H });
      const cands = (res.landmarks || []).map(lm => {
        const thumb = P(lm[4]), index = P(lm[8]), wrist = P(lm[0]), knuckle = P(lm[9]);
        const palm = Math.max(1, Math.hypot(wrist.x - knuckle.x, wrist.y - knuckle.y));
        return {
          x: (thumb.x + index.x) / 2,
          y: (thumb.y + index.y) / 2,
          ratio: Math.hypot(thumb.x - index.x, thumb.y - index.y) / palm
        };
      });

      if (!cands.length) {
        if (hand) hand.fresh = false;
        if (hand && nowMs - hand.seen > 250) hand = null;   // gone for a moment = gone
        return;
      }
      // Follow the same hand between frames; otherwise take the first one seen.
      const ref = hand || cands[0];
      const c = cands.reduce((a, b) => Math.hypot(a.x - ref.x, a.y - ref.y) <= Math.hypot(b.x - ref.x, b.y - ref.y) ? a : b);
      const wasPinched = hand ? hand.pinched : false;
      // Hysteresis so a pinch doesn't flicker open and shut.
      const pinched = wasPinched ? c.ratio < 0.5 : c.ratio < 0.33;
      const k = 0.65;   // light smoothing: steady, but still feels attached to your fingers
      hand = hand
        ? { x: hand.x + (c.x - hand.x) * k, y: hand.y + (c.y - hand.y) * k, pinched, wasPinched, seen: nowMs, fresh: true }
        : { x: c.x, y: c.y, pinched, wasPinched: false, seen: nowMs, fresh: true };
    }

    // ======================================================================
    // The creatures' own movement: they all swim about at once, keep a little
    // space between each other, and one at a time can be held.
    // ======================================================================
    let bodies = null;
    let held = null;
    let bubbles = [];
    const POP_IN = 0.6;
    const easeOutBack = x => { const c1 = 1.9; return 1 + (c1 + 1) * (x - 1) ** 3 + c1 * (x - 1) ** 2; };

    function creatureSize() { return canvas.height * 0.26; }

    function makeBodies(now) {
      const W = canvas.width, H = canvas.height;
      return CREATURES.map((_, i) => {
        const x = W * (0.14 + 0.72 * i / (CREATURES.length - 1)), y = H * (0.5 + 0.28 * (i % 2));
        return { index: i, x, y, vx: 0, vy: 0, facing: i % 2 ? 1 : -1, wx: x, wy: y,
                 nextWander: now + 2 + i, coastUntil: 0, wiggle: 0, born: now + 0.3 + i * 0.35, bubbled: false,
                 sq: 0, sqv: 0, nx: 1, ny: 0, pen: 0 };
      });
    }

    function hitTest(px, py) {
      const size = creatureSize();
      let best = null, bestD = Infinity;
      for (const b of bodies) {
        const c = CREATURES[b.index], cx = b.x, cy = b.y - size * c.cy;
        const d = Math.hypot(px - cx, py - cy);
        if (d < size * (c.r + 0.2) && d < bestD) { bestD = d; best = b; }
      }
      return best;
    }

    // Soft, solid bodies: when two creatures overlap they push apart with a
    // springy force, so they squash into each other for a moment and bounce off.
    const STIFF = 450, DAMP = 7;   // spring (1/s²) and damping (1/s) of a contact
    function collide(size, dt, now) {
      for (const b of bodies) b.pen = 0;
      for (let i = 0; i < bodies.length; i++) for (let j = i + 1; j < bodies.length; j++) {
        const a = bodies[i], b = bodies[j];
        if (now < a.born || now < b.born) continue;
        const ca = CREATURES[a.index], cb = CREATURES[b.index];
        const ax = a.x, ay = a.y - size * ca.cy, bx = b.x, by = b.y - size * cb.cy;
        let dx = bx - ax, dy = by - ay;
        const d = Math.hypot(dx, dy) || 0.01, reach = size * (ca.r + cb.r);
        if (d >= reach) continue;
        dx /= d; dy /= d;
        const pen = reach - d;
        // the one you're holding is solid as a paddle: it pushes, but isn't pushed
        const wa = a === held ? 0 : 1, wb = b === held ? 0 : 1, wsum = wa + wb;
        if (!wsum) continue;
        const vn = (b.vx - a.vx) * dx + (b.vy - a.vy) * dy;       // closing speed along the contact
        const f = (STIFF * pen - DAMP * vn * (vn < 0 ? 1 : 0.3)) * dt;
        a.vx -= dx * f * wa / wsum * 2; a.vy -= dy * f * wa / wsum * 2;
        b.vx += dx * f * wb / wsum * 2; b.vy += dy * f * wb / wsum * 2;
        // never let them pass through each other, however hard they're thrown
        const hard = pen - reach * 0.35;
        if (hard > 0) {
          a.x -= dx * hard * wa / wsum; a.y -= dy * hard * wa / wsum;
          b.x += dx * hard * wb / wsum; b.y += dy * hard * wb / wsum;
        }
        for (const [o, r] of [[a, ca.r], [b, cb.r]]) {
          const k = pen / (size * r * 2);
          if (k > o.pen) { o.pen = k; o.nx = dx; o.ny = dy; }
        }
        if (vn < -size * 2.2 && Math.random() < 0.5) spawnBubbles((ax + bx) / 2, (ay + by) / 2 + size * 0.4, size * 0.5, now);
      }
      // the squash itself is a little spring too, so it wobbles after a bump
      for (const b of bodies) {
        const target = Math.min(0.35, b.pen * 2);
        b.sqv += (420 * (target - b.sq) - 14 * b.sqv) * dt;
        b.sq = Math.max(-0.15, Math.min(0.4, b.sq + b.sqv * dt));
      }
    }

    function spawnBubbles(x, y, size, at) {
      for (let i = 0; i < 14; i++) {
        bubbles.push({
          born: at + Math.random() * 0.15,
          x: x + (Math.random() - 0.5) * size * 0.7,
          y: y - size * (0.3 + Math.random() * 0.4),
          vx: (Math.random() - 0.5) * size * 0.4,
          vy: -size * (0.4 + Math.random() * 0.6),
          r: size * (0.02 + Math.random() * 0.05),
          life: 0.8 + Math.random() * 0.6
        });
      }
    }

    function showInfo(i) {
      creatureName.textContent = CREATURES[i].name;
      creatureFact.textContent = CREATURES[i].fact;
    }

    function updateBodies(now, dt) {
      const W = canvas.width, H = canvas.height, size = creatureSize();
      if (!bodies) bodies = makeBodies(now);

      // letting go, or catching one
      if (held && (!hand || !hand.pinched)) {
        held.coastUntil = now + 2.8;       // it keeps your hand's momentum, so you can throw it off the screen
        held.nextWander = held.coastUntil;
        spawnBubbles(held.x, held.y, size, now);
        held = null;
      } else if (!held && hand && hand.pinched && !hand.wasPinched) {
        const b = hitTest(hand.x, hand.y);
        if (b && now >= b.born) {
          held = b;
          everGrabbed = true;
          b.offX = b.x - hand.x;
          b.offY = b.y - hand.y;
          showInfo(b.index);
        }
      }

      const minX = size * 0.55, maxX = W - size * 0.55, minY = size * 1.05, maxY = H - size * 0.02;
      collide(size, dt, now);
      for (const b of bodies) {
        if (!b.bubbled && now >= b.born) { b.bubbled = true; spawnBubbles(b.x, b.y, size, now); }
        if (b === held && !hand.fresh) {
          // hand briefly out of sight (often mid-throw): keep flying at the hand's last speed
          b.x += b.vx * dt;
          b.y += b.vy * dt;
        } else if (b === held) {
          const tx = hand.x + b.offX, ty = hand.y + b.offY;
          const nx = b.x + (tx - b.x) * 0.7, ny = b.y + (ty - b.y) * 0.7;
          b.vx = b.vx * 0.5 + ((nx - b.x) / dt) * 0.5;
          b.vy = b.vy * 0.5 + ((ny - b.y) / dt) * 0.5;
          b.x = nx; b.y = ny;
        } else {
          // Swim about: drift towards a wandering target, with water drag. The edges of the
          // picture aren't walls: a thrown creature coasts off screen, then swims back in.
          const coasting = now < b.coastUntil;
          if (!coasting && now > b.nextWander) {
            b.wx = minX + Math.random() * (maxX - minX);
            b.wy = minY + Math.random() * (maxY - minY);
            b.nextWander = now + 4 + Math.random() * 5;
          }
          const drag = Math.exp(-dt * (coasting ? 0.7 : 1.4));
          b.vx *= drag; b.vy *= drag;
          if (!coasting) {
            b.vx += (b.wx - b.x) * 0.22 * dt;
            b.vy += (b.wy - b.y) * 0.22 * dt;
          }
          const max = W * 2.5, sp = Math.hypot(b.vx, b.vy);
          if (sp > max) { b.vx *= max / sp; b.vy *= max / sp; }
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          // don't let it get lost for good: far off screen, it stops and turns back
          if (b.x < -W || b.x > 2 * W) { b.x = Math.max(-W, Math.min(2 * W, b.x)); b.vx = 0; }
          if (b.y < -H || b.y > 2 * H) { b.y = Math.max(-H, Math.min(2 * H, b.y)); b.vy = 0; }
        }
        // Look the way it's moving; struggle a bit while held.
        if (Math.abs(b.vx) > size * 0.15) b.facing = b.vx > 0 ? -1 : 1;
        const struggle = b === held ? 0.1 * Math.sin(now * 13) + 0.05 * Math.sin(now * 29) : 0;
        b.wiggle += (struggle - b.wiggle) * 0.3;
      }

      if (stage3d === null) setBanner('Growing your 3D creatures…');
      else if (stage3d === false) setBanner('The 3D creatures couldn’t load in this browser');
      else if (hands === null) setBanner('Loading hand tracker…');
      else if (hands === false) setBanner('Hand tracker unavailable, so the creatures just swim about');
      else if (!everGrabbed) setBanner('Pinch a creature with your fingers to catch it');
      else setBanner('');
    }

    function drawCreatures(now) {
      const size = creatureSize();
      const items = [];
      for (const b of bodies) {
        if (now < b.born) continue;
        items.push({
          index: b.index, x: b.x, y: b.y, size, facing: b.facing,
          z: b === held ? size * 0.3 : 0,          // the one you're holding comes towards you
          squash: { amount: b.sq, nx: b.nx, ny: b.ny },
          scale: easeOutBack(Math.min(1, (now - b.born) / POP_IN)),
          spin: -b.wiggle
        });
      }
      if (stage3d) stage3d.render(canvas.width, canvas.height, now, items);
    }

    function drawHud(now) {
      if (hud.width !== canvas.width || hud.height !== canvas.height) { hud.width = canvas.width; hud.height = canvas.height; }
      hctx.clearRect(0, 0, hud.width, hud.height);

      bubbles = bubbles.filter(b => now - b.born < b.life);
      hctx.lineWidth = 1.6;
      for (const b of bubbles) {
        const a = now - b.born;
        if (a < 0) continue;
        const k = a / b.life;
        hctx.strokeStyle = `rgba(220,245,255,${0.9 * (1 - k)})`;
        hctx.fillStyle = `rgba(200,240,255,${0.15 * (1 - k)})`;
        hctx.beginPath(); hctx.arc(b.x + b.vx * a, b.y + b.vy * a, b.r * (1 + k * 0.6), 0, TAU); hctx.fill(); hctx.stroke();
      }

      // a small ring at your pinch point so you can see what the tracker sees
      if (!hand) return;
      const r = Math.max(8, creatureSize() * 0.06);
      const ready = !held && hitTest(hand.x, hand.y);
      hctx.save();
      hctx.lineWidth = 3;
      if (held) {
        hctx.fillStyle = 'rgba(76, 201, 255, .55)';
        hctx.strokeStyle = 'rgba(200, 240, 255, .95)';
        hctx.beginPath(); hctx.arc(hand.x, hand.y, r * 0.7, 0, TAU); hctx.fill(); hctx.stroke();
      } else {
        hctx.strokeStyle = ready ? 'rgba(76, 201, 255, .95)' : 'rgba(255, 255, 255, .7)';
        if (ready) { hctx.shadowColor = 'rgba(76, 201, 255, .9)'; hctx.shadowBlur = 12; }
        hctx.beginPath(); hctx.arc(hand.x, hand.y, r, 0, TAU); hctx.stroke();
      }
      hctx.restore();
    }

    function setBanner(text) {
      if (banner.textContent !== text) banner.textContent = text;
      banner.hidden = !text;
    }

    // ---------- render loop ----------
    function renderFrame() {
      if (!stream) return;
      if (video.readyState >= 2 && video.videoWidth) {
        const scale = Math.min(1, MAX_WIDTH / video.videoWidth);
        const w = Math.round(video.videoWidth * scale), h = Math.round(video.videoHeight * scale);
        if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; bodies = null; held = null; }
        ctx.drawImage(video, 0, 0, w, h);
        const nowMs = performance.now();
        const dt = Math.min(1 / 30, Math.max(0.001, (nowMs - lastTime) / 1000));   // small steps keep the springy contacts stable
        lastTime = nowMs;
        trackHands(nowMs);
        updateBodies(nowMs / 1000, dt);
        drawCreatures(nowMs / 1000);
        drawHud(nowMs / 1000);
      }
      scheduleFrame();
    }
    function scheduleFrame() {
      if ('requestVideoFrameCallback' in video) video.requestVideoFrameCallback(renderFrame);
      else requestAnimationFrame(renderFrame);
    }

    // ======================================================================
    // Camera + controls
    // ======================================================================
    function setStatus(live, text) {
      statusEl.classList.toggle('live', live);
      statusText.textContent = text;
    }

    function stop() {
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = null;
      video.srcObject = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hctx.clearRect(0, 0, hud.width, hud.height);
      if (stage3d) stage3d.clear();
      banner.hidden = true;
    }

    async function start(deviceId) {
      stop();
      message.hidden = false;
      message.textContent = 'Requesting camera access…';
      try {
        const size = { width: { ideal: 1280 }, height: { ideal: 720 } };
        stream = await navigator.mediaDevices.getUserMedia({
          video: deviceId ? { deviceId: { exact: deviceId }, ...size } : size,
          audio: false
        });
        video.srcObject = stream;
        await video.play().catch(() => {});
        message.hidden = true;
        const s = stream.getVideoTracks()[0].getSettings();
        setStatus(true, `LIVE · ${s.width}×${s.height}`);
        toggleBtn.textContent = 'Pause';
        if (hands === null) loadHands();
        scheduleFrame();
        await listCameras(s.deviceId);
      } catch (err) {
        stream = null;
        setStatus(false, 'Offline');
        message.textContent = err.name === 'NotAllowedError'
          ? 'Camera access was denied. Allow camera access for this page in your browser (and in System Settings → Privacy & Security → Camera), then reload.'
          : `Could not start the camera: ${err.message || err.name}`;
      }
    }

    async function listCameras(activeId) {
      const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
      cameraSelect.innerHTML = '';
      devices.forEach((d, i) => {
        const opt = document.createElement('option');
        opt.value = d.deviceId;
        opt.textContent = d.label || `Camera ${i + 1}`;
        if (d.deviceId === activeId) opt.selected = true;
        cameraSelect.appendChild(opt);
      });
      cameraSelect.hidden = devices.length < 2;
    }

    cameraSelect.addEventListener('change', () => start(cameraSelect.value));

    toggleBtn.addEventListener('click', () => {
      if (stream) {
        stop();
        setStatus(false, 'Paused');
        message.hidden = false;
        message.textContent = 'Feed paused.';
        toggleBtn.textContent = 'Resume';
      } else {
        start(cameraSelect.value || undefined);
      }
    });

    mirrorBtn.addEventListener('click', () => {
      const on = canvas.classList.toggle('mirror');
      glCanvas.classList.toggle('mirror', on);
      hud.classList.toggle('mirror', on);
      mirrorBtn.textContent = `Mirror: ${on ? 'on' : 'off'}`;
    });

    snapBtn.addEventListener('click', () => {
      if (!stream) return;
      const out = document.createElement('canvas');
      out.width = canvas.width;
      out.height = canvas.height;
      const o = out.getContext('2d');
      if (canvas.classList.contains('mirror')) { o.translate(out.width, 0); o.scale(-1, 1); }
      o.drawImage(canvas, 0, 0);
      if (stage3d) o.drawImage(glCanvas, 0, 0, out.width, out.height);   // the creatures
      const a = document.createElement('a');
      a.download = `snapshot-${new Date().toISOString().replace(/[:.]/g, '-')}.png`;
      a.href = out.toDataURL('image/png');
      a.click();
    });

    setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleString(); }, 1000);

    load3D();
    if (!navigator.mediaDevices?.getUserMedia) {
      setStatus(false, 'Unsupported');
      message.textContent = 'This browser does not support camera access. Open the page over https:// or http://localhost in Chrome, Safari, or Firefox.';
    } else {
      start();
    }
  </script>
</body>
</html>
